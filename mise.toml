[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
hk = "latest"
pkl = "latest"

[tasks.pre-commit]
run = "hk run pre-commit"

# Parameterized smoke test: install one toolchain variant and verify its
# compiler runs. Override TOOL/BIN/VERSION via `extends` to test another
# variant (see smoke:llvm / smoke:gnuarmemb in mise.ci.toml). West is covered
# separately by test:run.
[task_templates."test:local"]
allow_env = ["MISE_USE_VERSIONS_HOST"]
vars = { VERSION = "0.17.0", TOOL = "arm", BIN = "arm-zephyr-eabi-gcc" }
run = '''
# Trust the repo config so nested `mise` calls work in CI (locally a no-op).
mise trust
# Link for development
mise deactivate
mise plugins ln vfox-zephyr-test . --force
mise ls-remote vfox-zephyr-test:{{vars.TOOL}}
mise install vfox-zephyr-test:{{vars.TOOL}}@{{vars.VERSION}}
mise exec vfox-zephyr-test:{{vars.TOOL}}@{{vars.VERSION}} -- {{vars.BIN}} --version
mise rm vfox-zephyr-test:{{vars.TOOL}} --yes
'''

[tasks."smoke:test"]
description = "Smoke test the arm (zephyr GNU) variant"
extends = "test:local"
