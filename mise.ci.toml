[env]
MISE_USE_VERSIONS_HOST = "0"

[vars]
test_sandbox = "tests/sandbox"
test_manifest = "tests/zephyr-manifest.yml"

[tools]
lua-language-server = "latest"

[tasks.lint]
description = "Lint Lua sources"
run = 'lua-language-server --check . --checklevel=Error --logpath="${RUNNER_TEMP:-/tmp}/luals-log"'

# Variant smoke tests: reuse the parameterized `test:local` template (mise.toml)
# and just point it at a different toolchain variant. The real install/exec
# check runs in GitHub Actions CI.
[tasks."smoke:llvm"]
description = "Smoke test the llvm variant (Zephyr SDK >= 1.0.0)"
extends = "test:local"
vars = { VERSION = "1.0.0", TOOL = "llvm", BIN = "clang" }

[tasks."smoke:gnuarmemb"]
description = "Smoke test the gnuarmemb variant (Arm GNU Toolchain)"
extends = "test:local"
vars = { VERSION = "15.2.rel1", TOOL = "gnuarmemb", BIN = "arm-none-eabi-gcc" }

[tasks."test:setup_sandbox"]
hide = true
run = '''
[[ -d {{vars.test_sandbox}} ]] && rm -rf {{vars.test_sandbox}}
mise_toml={{vars.test_sandbox}}/mise.local.toml
app_dir={{vars.test_sandbox}}/app
mkdir -p "$app_dir"
mise trust {{vars.test_sandbox}}
mise generate config "$mise_toml" -t tests/configs/.tool_versions
cp tests/zephyr-manifest.yml "${app_dir}/west.yml"
mise config set vars._.file --file "$mise_toml" {{config_root}}/tests/configs/.vars
'''


[tasks."test:setup_plugin"]
hide = true
depends = ['test:setup_sandbox']
run = '''
mise plugins ln vfox-zephyr-test .  --force
# Only verify the plugin links and resolves versions here; actual tool
# install/exec (which needs the sandbox's declared uv) is covered by test:run.
mise ls-remote "vfox-zephyr-test:arm"
mise ls-remote "vfox-zephyr-test:west"
'''

[tasks."test:cleanup"]
hide = true
run = '''
#!/usr/bin/env zsh
rm -rf {{vars.test_sandbox}}
mise prune --tools --yes
mise plugins rm vfox-zephyr-test --silent
mise cache c
# west's install moves bin/west out of the linked plugin dir (os.rename), so
# restore the committed shim from git instead of a manual backup/restore.
git checkout -- bin/west bin/west.lock 2>/dev/null || true
:
'''


[tasks."test:run"]
dir = "{{vars.test_sandbox}}"
description = "Test for backend plugin"
depends = ['test:setup_plugin']
run = '''
#!/usr/bin/env zsh
[[ ! -f mise.local.toml ]] && echo "NO mise.local.toml found" && exit 1
mise use uv
mise use cmake
mise ls
mise x vfox-zephyr-test:west -- west init -l app
mise x vfox-zephyr-test:west -- west update -o=--depth=1 --narrow
[[ -d zephyr ]] || { echo "Zephyr base missing"; exit 1 }
mise set ZEPHYR_BASE="$PWD/zephyr"
mise x vfox-zephyr-test:west  vfox-zephyr-test:arm@0.17.0 -- west build -p -b reel_board zephyr/samples/hello_world
[[ -d build ]] || { echo "build dir missing"; exit 1 }
'''
depends_post = ["test:cleanup"]
