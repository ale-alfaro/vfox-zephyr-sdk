[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
uv = "latest"
cmake = "latest"
lua-language-server = "latest"

[tasks.lint]
description = "Lint Lua sources"
run = 'lua-language-server --check . --checklevel=Error --logpath="${RUNNER_TEMP:-/tmp}/luals-log"'

[task_templates."test:script"]
usage = '''
flag "--dry-run" env="DRY_RUN"
'''
run = '''
#!/usr/bin/env zsh

{% set_global backend = 'vfox-' ~ vars.variant %}

{% macro generate_test_script(version) %}
  {% set backend = 'vfox-' ~ vars.variant %}
  {% set manifest = vars.variant ~ '-manifest' %}
  {% set workspace = vars.variant ~ '-workspace' %}
  {% if vars.toolchain_alias is defined %}{% set toolchain = backend ~ ':' ~ vars.toolchain_alias  %}{% else %}{% set toolchain = backend  ~ ':' ~ vars.toolchain %}{% endif %}
  {% set west = backend  ~ ':west@1.5.0'  %}
  {% set toolchain = toolchain ~  '@' ~ version %} 
  echo "=== Backend {{ backend }} ==="

  {% if vars.variant == 'ncs' %}
  mise install "{{ backend }}:nrfutil@latest"
  mise x "{{ backend }}:nrfutil@latest" -- nrfutil --version
  {% endif %}
  mise ls-remote "{{toolchain}}"
  mise ls-remote "{{west}}"
  mise x "{{toolchain}}" -- arm-zephyr-eabi-gcc --version
  mise x "{{west}}" -- west --version

  mkdir -p ~/.cache/west
  mkdir -p {{workspace}}/app
  cp tests/{{ manifest }}.yml {{ workspace}}/app/west.yml

  _west=(mise x '--cd'  {{ workspace }} "{{west}}" '--' west)
  _west_build=(mise x '--cd' {{ workspace }} "{{ west}}" "{{ toolchain }}" '--' west build)
  $_west init -l app
  $_west update -o=--depth=1 --narrow --auto-cache ~/.cache/west
  $_west_build -p -b {{vars.board}}  {{vars.sample}} -d build

  if [[ -d {{ workspace }}/build ]]; then
    echo "Integration test: build succeeded"
  else
    echo "Integration test: build directory not found"
  fi
  rm -rf {{ workspace }}
{% endmacro generate_test_script %}


{% set vers = vars.versions | split(pat=",") %}
mise plugins ln '{{ backend }}' "{{config_root}}"
{% for ver in vers %}
  if [[ ! -z "${usage_dry_run:-}" || ! -z "${DRY_RUN:-}" ]]; then
      echo "Dry-run! Printing script:"
      print '{{ self::generate_test_script(version=ver) }}'
  else
      {{ self::generate_test_script(version=ver) }}
  fi
{% endfor %}
mise remove {{backend}}
mise plugins remove --all
mise reshim
'''

[tasks.zephyr_test]
vars = { "_" = { file = "{{config_root}}/tests/configs/zephyr.env" }, versions = "0.17.0,0.17.4" }
extends = "test:script"

[tasks.ncs_test]
vars = { "_" = { file = "{{config_root}}/tests/configs/ncs.env" }, versions = "3.2.1" }
extends = "test:script"

[tasks.test]
run = [{ tasks = ["zephyr_test", "ncs_test"] }]
