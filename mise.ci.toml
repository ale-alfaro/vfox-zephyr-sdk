[env]
MISE_USE_VERSIONS_HOST = "0"

[vars]
"_".file = "{{config_root}}/tests/configs/default.vars"

[tools]
uv = "latest"
cmake = "latest"
lua-language-server = "latest"

[tasks.lint]
description = "Lint Lua sources"
run = 'lua-language-server --check . --checklevel=Error --logpath="${RUNNER_TEMP:-/tmp}/luals-log"'

[tasks.smoke]
dir = "{{cwd}}"
usage = '''
arg "variant"
arg "toolchain"
arg "version"
  '''
run = '''
#!/usr/bin/env zsh
set -e
toolchain="vfox-{{usage.variant}}:{{usage.toolchain}}@{{usage.version}}"
west="vfox-{{usage.variant}}:west@1.5.0"
mise ls-remote "$toolchain"
mise ls-remote "$west"
mise install "$toolchain"
mise install "$west"
mise x "$toolchain" -- arm-zephyr-eabi-gcc --version
mise x "$west" -- west --version
'''

[tasks.integration]
dir = "{{cwd}}"
usage = '''
arg "variant"
arg "toolchain"
arg "version"
arg "board"
arg "sample"
'''
run = '''
#!/usr/bin/env zsh
set -e
toolchain="vfox-{{usage.variant}}:{{usage.toolchain}}@{{usage.version}}"
west="vfox-{{usage.variant}}:west@1.5.0"
mise x "$west" -- west init -l app
mise x "$west" -- west update -o=--depth=1 --narrow --auto-cache ~/.cache/west
mise x "$west" "$toolchain" -- west build -p -b {{usage.board}} {{usage.sample}} -d build
[[ -d build ]] || { echo "build dir missing"; exit 1 }
'''

[tasks.setup_test]
usage = '''
arg "<variant>"
arg "<version>"
'''
dir = "{{config_root}}"
run = '''
mise plugins ln "vfox-{{usage.variant}}" .  --force
mkdir -p "{{usage.variant}}-{{usage.version}}/app"
cp "tests/{{usage.variant}}-manifest.yml" "{{usage.variant}}-{{usage.version}}/app/west.yml"
'''
[task_templates."workflow:test"]
depends = [{ task = "setup_test", args = ["{{vars.variant}}", "{{vars.version}}"] }]
run = [
  "mise -E ci --cd {{vars.variant}}-{{vars.version}} run smoke {{vars.variant}} {{vars.toolchain}} {{vars.version}}",
  "mise -E ci --cd {{vars.variant}}-{{vars.version}} run integration {{vars.variant}} {{vars.toolchain}} {{vars.version}} {{vars.board}} {{vars.sample}}",
]

[tasks."test:default"]
extends = "workflow:test"

[tasks."test:v0-17.4"]
vars = { version = "0.17.4" }
extends = "workflow:test"

[tasks.test]
run = [{ task = "test:default" }, { task = "test:v0-17.4" }]
