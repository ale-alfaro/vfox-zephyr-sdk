[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
"cargo:emmylua_check" = "latest"
"cargo:emmylua_formatter" = "latest"

[tasks.lint]
description = "Lint Lua sources"
# luafmt stays off types/: it duplicates multi-line doc comments there on every pass.
run = ['emmylua_check --severity=error .', 'luafmt --check hooks lib']

# Parameterized smoke test: install one toolchain variant and verify its
# compiler runs. Override TOOL/BIN/VERSION via `extends` to test another
# variant (see smoke:llvm / smoke:gnuarmemb in mise.ci.toml). West is covered
# separately by test:run.
[tasks."smoke_test:tool"]
description = "Smoke test for tools"
usage = '''
arg "<tool>" {
  help "Toolchain"
  choices "llvm" "arm" "west" "gnuarmemb"
}
arg "[bin]" {
  help "Binary executable that tool provides"
}
'''
run = '''
#!/usr/bin/env zsh
set -eu
mise plugins ln vfox-zephyr-test . --force
mise ls-remote vfox-zephyr-test:{{usage.tool}}
mise install vfox-zephyr-test:{{usage.tool}}@latest
{% if usage.bin %}
  mise exec vfox-zephyr-test:{{usage.tool}}@latest -- {{usage.bin}} --version
{% endif %}
mise rm vfox-zephyr-test:{{usage.tool}} --yes
'''

# Parameterized e2e test:
[tasks."test:setup_plugin"]
hide = true
usage = 'arg "<tool>"'
run = '''
#!/usr/bin/env zsh
set -eu
mise use uv cmake
mise plugins ln vfox-zephyr-test . --force
mise install vfox-zephyr-test:{{usage.tool}}
'''

[tasks."test_e2e:toolchain:version"]
usage = '''
arg "<toolchain>" {
  help "Toolchain"
  choices "llvm@latest" "arm@latest" "arm@0.17.0" "gnuarmemb@latest"
}
'''
depends = [{ task = 'test:setup_plugin', args = ['{{usage.toolchain}}'] }]
depends_post = ["test:cleanup"]
run = '''
#!/usr/bin/env zsh
set -eu
mise install vfox-zephyr-test:west
[[ {{usage.toolchain}} == *latest ]] && compat=v4.4 || compat=v3.7
sandbox="${MISE_CONFIG_ROOT?}/tests/zephyr-$compat"
rm -rf "$sandbox" && mkdir -p "$sandbox/app"
cp "$sandbox-manifest.yml" "$sandbox/app/west.yml"
cd "$sandbox"
mise x vfox-zephyr-test:west -- west init -l app
mise x vfox-zephyr-test:west -- west update -o=--depth=1 --narrow
mise x vfox-zephyr-test:west -- west config --local zephyr.base-prefer configfile
mise x vfox-zephyr-test:west -- west config --local zephyr.base zephyr
mise x vfox-zephyr-test:west vfox-zephyr-test:{{usage.toolchain}} -- west build -p -b reel_board zephyr/samples/hello_world
if [[ {{usage.toolchain}} == arm@* ]] && mise x vfox-zephyr-test:{{usage.toolchain}} -- which arm-zephyr-eabi-gdb-py; then
  echo "SDK arm-zephyr-eabi-gdb-py should have been removed"; exit 1
fi
rm -rf "$sandbox"
'''

[tasks."test_e2e:gdb-py"]
description = "Build gdb-py from source and verify it still boots its bundled Python after being moved"
depends = [{ task = 'test:setup_plugin', args = ['gdb-py@latest'] }]
depends_post = ["test:cleanup"]
run = '''
#!/usr/bin/env zsh
set -eu
moved="${RUNNER_TEMP:-/tmp}/gdb-py-moved"
rm -rf "$moved" && cp -r "$(mise where vfox-zephyr-test:gdb-py@latest)" "$moved"
prefix=$("$moved/bin/arm-zephyr-eabi-gdb-py" --nx --batch -ex 'python import sys; print(sys.prefix)')
[[ "$prefix" == "$moved/python" ]] || { echo "gdb-py did not relocate: $prefix"; exit 1; }
rm -rf "$moved"
'''

[tasks."test:cleanup"]
hide = true
run = '''
#!/usr/bin/env zsh
mise unuse -y uv cmake
mise prune --tools --yes
mise plugins rm vfox-zephyr-test --silent
mise cache c
mise reshim
# west's install moves bin/west out of the linked plugin dir (os.rename), so
# restore the committed shim from git instead of a manual backup/restore.
git checkout -- bin/west bin/west.lock 2>/dev/null || true
:
'''
