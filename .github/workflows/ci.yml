name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        toolchain-family: [arm, gnuarmemb]
        version: [latest]
        zephyr: [v4.4.0]
        llvm: [""]
        os: [ubuntu-latest, macos-latest]
        include:
          - { toolchain-family: arm, version: latest, zephyr: v4.4.0, llvm: --llvm, os: ubuntu-latest }
          - { toolchain-family: arm, version: latest, zephyr: v4.4.0, llvm: --llvm, os: macos-latest }
          - { toolchain-family: arm, version: 0.17.0, zephyr: v3.7.0, llvm: "", os: ubuntu-latest }
          - { toolchain-family: arm, version: 0.17.0, zephyr: v3.7.0, llvm: "", os: macos-latest }
    runs-on: ${{matrix.os}}
    env:
      MISE_ENV: ci
      GITHUB_TOKEN: ${{ github.token }}
      PLUGIN_NAME: vfox-zephyr-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      # The workspace root becomes the west topdir; the plugin checkout in app/ doubles as the manifest repo.
      - name: Bootstrap tools and runner
        uses: jdx/mise-action@v5
        with:
          experimental: true
          bootstrap: true
          mise_toml: |
            [bootstrap.files."${{ github.workspace }}/.west/config"]
            content = '''
            [manifest]
            path = app
            file = west.yml

            [zephyr]
            base = zephyr
            base-prefer = configfile

            [build]
            pristine = always
            generator = Ninja
            sysbuild = false
            '''

            [bootstrap.files."${{ github.workspace }}/app/west.yml"]
            content = '''
            manifest:
              remotes:
                - name: zephyrproject-rtos
                  url-base: https://github.com/zephyrproject-rtos
              projects:
                - name: zephyr
                  remote: zephyrproject-rtos
                  revision: ${{ matrix.zephyr }}
                  clone-depth: 1
                  import:
                    name-allowlist:
                      - cmsis
                      - cmsis_6
                      - hal_nordic
              self:
                path: app
            '''

            [bootstrap.packages]
            "apt:device-tree-compiler" = "latest"
            "apt:gcc-multilib" = "latest"
            "apt:g++-multilib" = "latest"
            "apt:bison" = "latest"
            "apt:flex" = "latest"
            "apt:libgmp-dev" = "latest"
            "apt:libmpfr-dev" = "latest"
            "apt:libexpat1-dev" = "latest"
            "apt:libncurses-dev" = "latest"

            [tools]
            uv = "latest"
            cmake = "latest"

            [tasks.bootstrap]
            run = "mise plugins link vfox-zephyr-sdk app"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/west
          key: ${{ runner.os }}-west-${{ hashFiles('app/mise.ci.toml') }}

      - name: Lua typecheck and linting
        working-directory: app
        run: mise run lint

      - name: Test ${{ matrix.toolchain-family }}@${{ matrix.version }} ${{ matrix.llvm }}
        working-directory: app
        run: mise run --timeout 20m tests:e2e ${{ matrix.toolchain-family }}@${{ matrix.version }} ${{ matrix.llvm }}
