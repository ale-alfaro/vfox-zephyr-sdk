name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        zephyr-sdk-version: [0.17.0, latest]
        os: [ubuntu-latest,macos-latest]
    runs-on: ${{matrix.os}}
    env:
      MISE_ENV: ci
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/west
            ~/.local/share/mise
          key: ${{ runner.os }}-west-${{ hashFiles('mise.ci.toml') }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
          gcc-multilib g++-multilib device-tree-compiler
      - name: Lua typecheck and linting
        run: mise run lint
      - name: Test Zephyr-SDK toolchain for ARM
        run: mise run --timeout 10m test_e2e:toolchain:version arm@${{matrix.zephyr-sdk-version}}
      - name: Test LLVM toolchain variant
        if: matrix.zephyr-sdk-version == 'latest'
        run:
          mise run --timeout 10m test_e2e:toolchain:version llvm@latest
      - name: Test gnuarmemb toolchain variant
        if: matrix.zephyr-sdk-version == 'latest'
        run:
          mise run --timeout 10m test_e2e:toolchain:version gnuarmemb@latest
      - name: Install gdb-py build dependencies (Linux)
        if: runner.os == 'Linux' && matrix.zephyr-sdk-version == 'latest'
        run:
          sudo apt-get install -y --no-install-recommends bison flex libgmp-dev
          libmpfr-dev libexpat1-dev libncurses-dev
      - name: Test gdb-py source build and relocation
        if: runner.os == 'Linux' && matrix.zephyr-sdk-version == 'latest'
        run:
          mise run --timeout 30m test_e2e:gdb-py
